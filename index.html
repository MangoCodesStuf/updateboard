<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mango</title><link rel="icon" type="image/png" href="favicon.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Space+Mono&family=Unbounded:wght@700&display=swap" rel="stylesheet"><style>
*,*::before,*::after{box-sizing:border-box}
html{font-size:14pt}
body{margin:0;min-height:100vh;min-width:320px;overflow-x:hidden;word-wrap:break-word;background-image:linear-gradient(rgba(0,0,0,0.051) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,0.051) 1px,transparent 1px),linear-gradient(212deg,#F2E8C9 0%,#F2D9D5 100%);background-size:31px 31px,31px 31px,auto;background-position:center,center,0% 0%;background-attachment:fixed;color:rgba(0,0,0,0.69);font-family:'Space Mono',monospace;line-height:1.5;display:flex;align-items:center;justify-content:center}
#introOverlay{position:fixed;inset:0;background:#000;display:flex;justify-content:center;align-items:center;z-index:999999999;opacity:1;transition:opacity 0.5s ease}
#introVideo{width:320px;max-width:90vw;max-height:90vh}
.site-wrapper{width:100%;padding:3rem 1rem;display:flex;justify-content:center;animation:fadeIn 1s ease 0.3s both}
.site-main{width:100%;display:flex;justify-content:center}
.inner{width:38rem;max-width:100%;padding:2rem;display:flex;flex-direction:column;gap:1.75rem}
.box{width:100%;border:3px solid #4F4F4F;border-radius:1rem;box-shadow:0.265rem 0.265rem 0 0 #4F4F4F}
.hero{padding:2rem;text-align:center;display:flex;flex-direction:column;align-items:center;gap:1rem}
.avatar{width:6.125rem;height:6.125rem;border-radius:50%;border:3px solid #4F4F4F;box-shadow:0.265rem 0.265rem 0 0 #4F4F4F;object-fit:cover;background:#FEFCF2}
.hero h1{margin:0;font-family:'Unbounded',sans-serif;font-weight:700;font-size:1.75em;line-height:1.375;text-transform:uppercase;letter-spacing:-0.04375rem;color:rgba(0,0,0,0.69)}
.hero p{margin:0;font-size:1em;line-height:1.5}
.card{display:flex;align-items:center;padding:2rem;gap:1rem;animation:fadeIn 0.8s ease both}
.card .text{flex:0 0 80%;display:flex;flex-direction:column;gap:0.5rem}
.card .icon-wrap{flex:0 0 20%;display:flex;justify-content:flex-end}
.card.position-left .icon-wrap{order:-1;justify-content:flex-start}
.card.position-up,.card.position-down{flex-direction:column;text-align:center}
.card.position-up .icon-wrap{order:-1;justify-content:center;width:100%}
.card.position-down .icon-wrap{order:1;justify-content:center;width:100%}
.card.position-up .text,.card.position-down .text{flex:1;width:100%;align-items:center}
.sticky-board{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem}
.sticky-note{position:relative;background:#FFF2A8;border:2px solid #4F4F4F;border-radius:.4rem;padding:1.25rem 1rem 1rem;box-shadow:4px 5px 0 #4F4F4F;transform:rotate(-.5deg);color:#333;white-space:pre-wrap;overflow-wrap:anywhere}
.sticky-note:nth-child(even){background:#CFF8E8;transform:rotate(.6deg)}
.sticky-note:nth-child(3n){background:#FFD9E2;transform:rotate(-.8deg)}
.sticky-note h2{font-family:'Unbounded',sans-serif;font-size:1rem;margin:.35rem 0 .5rem}
.sticky-note .post-date{font-size:.75rem;opacity:.75}
.sticky-pin{position:absolute;top:-.55rem;left:calc(50% - .45rem);width:.9rem;height:.9rem;border-radius:50%;background:#FD5176;border:2px solid #4F4F4F;box-shadow:1px 2px 0 #4F4F4F}
.sticky-note.pinned{outline:3px solid #FDDC2D;outline-offset:2px}
.post-heading{font-family:'Unbounded',sans-serif;text-transform:uppercase;font-size:1.3rem;margin:.25rem 0 1rem}
@media(max-width:736px){.card.position-left{flex-direction:column;text-align:center}.card.position-left .icon-wrap{justify-content:center}.card.position-up,.card.position-down{flex-direction:column}}
.card h2{margin:0;font-family:'Unbounded',sans-serif;font-weight:700;font-size:1.25em;line-height:1.375;text-transform:uppercase;letter-spacing:-0.04375rem}
.card p{margin:0;font-size:1em;line-height:1.5}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:1.75rem;width:100%}
.pair>.box{min-width:0}
.icon-btn{width:3rem;height:3rem;display:flex;align-items:center;justify-content:center;border-radius:0.75rem;background:#FEFCF2;border:2px solid #4F4F4F;box-shadow:0.265rem 0.265rem 0 0 #4F4F4F;text-decoration:none;color:#4F4F4F;transition:transform 0.25s ease}
.icon-btn svg{width:60%;height:60%;fill:#4F4F4F;pointer-events:none}
.icon-btn:hover{transform:translateY(-4px)}
.footer-icons{display:flex;justify-content:center;flex-wrap:wrap;gap:1.25rem;margin-top:0.5rem}
.footer-icons .icon-btn{width:3.5rem;height:3.5rem}
.credits{text-align:center;font-family:Arial,sans-serif;font-size:12px;color:rgba(152,61,47,0.502)}
@keyframes fadeIn{from{opacity:0;transform:translateY(1rem)}to{opacity:1;transform:none}}
@media (max-width:736px){html{font-size:12pt}.inner{padding:1.5rem;gap:1.5rem}.card{flex-direction:column;text-align:center;padding:1.5rem}.card .text{flex:none;width:100%;align-items:center}.card .icon-wrap{flex:none;justify-content:center}.pair{grid-template-columns:1fr}}
@media (max-width:480px){html{font-size:11pt}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
